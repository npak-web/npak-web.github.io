<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NPAK Online Converter (.zip ↔ .npak)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.2/jszip.js"></script>
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        background: #0d1117;
        color: #c9d1d9;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
      }
      .card {
        background: #161b22;
        border: 1px solid #30363d;
        border-radius: 12px;
        padding: 32px;
        width: 100%;
        max-width: 460px;
        text-align: center;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      }
      h1 {
        margin-top: 0;
        font-size: 1.5rem;
        color: #f0f6fc;
      }
      p {
        color: #8b949e;
        font-size: 0.95rem;
      }
      .drop-zone {
        border: 2px dashed #30363d;
        border-radius: 8px;
        padding: 32px 16px;
        margin: 20px 0;
        cursor: pointer;
        transition:
          border-color 0.2s,
          background 0.2s;
      }
      .drop-zone:hover,
      .drop-zone.dragover {
        border-color: #58a6ff;
        background: #1f242c;
      }
      input[type="file"] {
        display: none;
      }
      progress {
        width: 100%;
        height: 10px;
        margin-top: 16px;
        display: none;
      }
      .status {
        margin-top: 12px;
        font-size: 0.9rem;
        min-height: 20px;
      }
      .error {
        color: #f85149;
      }
      .success {
        color: #3fb950;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>📦 NPAK Онлайн-конвертер</h1>
      <p>
        Конвертация <b>.zip → .npak</b> и <b>.npak → .zip</b> прямо в браузере
      </p>

      <div class="drop-zone" id="dropZone">
        Нажмите или перетащите файл <b>.zip</b> или <b>.npak</b> сюда
        <input type="file" id="fileInput" accept=".zip,.npak" />
      </div>

      <progress id="progressBar" value="0" max="100"></progress>
      <div class="status" id="statusText"></div>
    </div>

    <script type="module">
      import { packTargets } from "./pack.js";
      import { unpackArchive } from "./unpack.js";

      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const progressBar = document.getElementById("progressBar");
      const statusText = document.getElementById("statusText");

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("dragover"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files.length) handleFile(fileInput.files[0]);
      });

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

      async function handleFile(file) {
        statusText.className = "status";
        progressBar.style.display = "block";
        progressBar.value = 0;

        try {
          const lowerName = file.name.toLowerCase();

          if (lowerName.endsWith(".zip")) {
            statusText.textContent = "Чтение ZIP-архива...";
            const zip = await JSZip.loadAsync(file);
            const entries = [];

            for (const [relativePath, zipEntry] of Object.entries(zip.files)) {
              if (zipEntry.dir) {
                entries.push({ path: relativePath, isDir: true, data: null });
              } else {
                const data = await zipEntry.async("uint8array");
                entries.push({ path: relativePath, isDir: false, data });
              }
            }

            statusText.textContent = "Упаковка в .npak...";
            const npakBytes = await packTargets(
              entries,
              (p) => (progressBar.value = p),
            );
            const outName = file.name.replace(/\.zip$/i, "") + ".npak";

            downloadBlob(
              new Blob([npakBytes], { type: "application/x-npak" }),
              outName,
            );
            statusText.className = "status success";
            statusText.textContent = `Готово! Скачан файл ${outName}`;
          } else if (lowerName.endsWith(".npak")) {
            statusText.textContent = "Распаковка .npak...";
            const arrayBuffer = await file.arrayBuffer();
            const items = await unpackArchive(
              arrayBuffer,
              (p) => (progressBar.value = p),
            );

            statusText.textContent = "Сборка ZIP-архива...";
            const zip = new JSZip();
            for (const item of items) {
              if (item.isDir) {
                zip.folder(item.path);
              } else {
                zip.file(item.path, item.data);
              }
            }

            const zipBlob = await zip.generateAsync({ type: "blob" });
            const outName = file.name.replace(/\.npak$/i, "") + ".zip";

            downloadBlob(zipBlob, outName);
            statusText.className = "status success";
            statusText.textContent = `Готово! Скачан файл ${outName}`;
          } else {
            throw new Error("Поддерживаются только файлы .zip и .npak");
          }
        } catch (err) {
          statusText.className = "status error";
          statusText.textContent = `Ошибка: ${err.message}`;
        }
      }
    </script>
  </body>
</html>
